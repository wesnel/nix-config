keys:
  - &machine_ngrok "age18x562mzy0377e2d9y28l4xeh7nqpyrt26ahsmrs9l0mueqperfqsx7eutq"
  - &machine_x230 "age1hqfrpe8q4x87ldunr5d4ndwgfnqzn4mqn84mjafqat96semucgksuy8fme"
  - &user_wgn "0xA776D2AD099E8BC0"
creation_rules:
  # The personal machines' secrets, which the work Mac must not decrypt.
  # sops takes the first rule that matches, so this one comes first.
  - path_regex: secrets/personal\.yaml$
    key_groups:
      - age:
          - *machine_x230
        pgp:
          - *user_wgn
  - path_regex: secrets/[^/]+\.(yaml|json|env|ini)$
    key_groups:
      - age:
          - *machine_ngrok
          - *machine_x230
        pgp:
          - *user_wgn
