# Read by checks.agent-tools-lint in the flake. A finding that does not apply
# is annotated where it is found, `//nolint:gosec // <why it does not apply>`;
# nolintlint refuses an annotation without a reason or a rule.
version: "2"

linters:
  default: none
  enable:
    - gosec
    - nolintlint

  settings:
    gosec:
      excludes:
        # These are CLIs that run git, gh and ssh with arguments and on paths
        # their caller names. Where a sandbox is the caller, the relay and
        # pr-loop's relayRefusal decide what it may name.
        - G204
        - G304
    nolintlint:
      require-explanation: true
      require-specific: true

  exclusions:
    rules:
      # Tests write to t.TempDir and run what they built themselves.
      - path: _test\.go
        linters:
          - gosec
      # Outside the guard an unchecked error is cleanup, output with nowhere
      # to report a failure, or a best-effort record, reminder or count. The
      # guard decides what an agent may run, so there an error denies the
      # call, or is annotated where it cannot change the decision.
      - path-except: internal/guard/
        text: "^G104:"
        linters:
          - gosec
      # File and directory modes in the review VM's code: the guest is
      # another user, and what it reads must stay readable by others.
      # Elsewhere each mode is annotated with why others may read it.
      - path: internal/prreview/
        text: "^G30[126]:"
        linters:
          - gosec

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false
