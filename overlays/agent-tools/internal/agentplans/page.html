<title>Agent plans</title>
<style>
/* One reading column: how fresh the data is, then Today, the review
   requests and the operator's own pull requests, an index of the plans,
   and each plan in full at #<plan ID>. Mantle's tokens, in the system
   face. */
:root {
  --bg: oklch(98.5% 0 0);
  --surface: oklch(100% 0 0);
  --border: oklch(87% 0 0);
  --border-muted: oklch(92.2% 0 0);
  --fg-strong: oklch(18.2% 0 0);
  --fg: oklch(18.2% 0 0 / 0.78);
  --fg-muted: oklch(18.2% 0 0 / 0.6);
  --accent: oklch(55% 0.158 241.966);
  --on-accent: oklch(100% 0 0);
  --danger: oklch(58.6% 0.253 17.585);
  --warning: oklch(55.5% 0.163 48.998);
  --success: oklch(50.8% 0.118 165.612);
  --important: oklch(55.8% 0.288 302.321);
  --neutral: oklch(55.6% 0 0);
  --ring: oklch(68.5% 0.169 237.323 / 0.35);
  --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --text-xs: 0.75rem;
  --text-sm: 0.875rem;
  --text-base: 1rem;
  --text-lg: 1.125rem;
  --text-xl: 1.25rem;
  --text-2xl: clamp(1.4rem, 1.1rem + 0.9vw, 1.75rem);
  --radius: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: oklch(18.2% 0 0);
    --surface: oklch(20.5% 0 0);
    --border: oklch(37.1% 0 0);
    --border-muted: oklch(26.9% 0 0);
    --fg-strong: oklch(98.5% 0 0);
    --fg: oklch(100% 0 0 / 0.74);
    --fg-muted: oklch(100% 0 0 / 0.55);
    --accent: oklch(74.6% 0.16 232.661);
    --on-accent: oklch(18.2% 0 0);
    --danger: oklch(70.4% 0.191 22.216);
    --warning: oklch(82.8% 0.189 84.429);
    --success: oklch(76.5% 0.177 163.223);
    --important: oklch(71.4% 0.203 305.504);
    --neutral: oklch(70.8% 0 0);
    --ring: oklch(74.6% 0.16 232.661 / 0.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: oklch(18.2% 0 0);
  --surface: oklch(20.5% 0 0);
  --border: oklch(37.1% 0 0);
  --border-muted: oklch(26.9% 0 0);
  --fg-strong: oklch(98.5% 0 0);
  --fg: oklch(100% 0 0 / 0.74);
  --fg-muted: oklch(100% 0 0 / 0.55);
  --accent: oklch(74.6% 0.16 232.661);
  --on-accent: oklch(18.2% 0 0);
  --danger: oklch(70.4% 0.191 22.216);
  --warning: oklch(82.8% 0.189 84.429);
  --success: oklch(76.5% 0.177 163.223);
  --important: oklch(71.4% 0.203 305.504);
  --neutral: oklch(70.8% 0 0);

}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-sans);
  font-size: var(--text-base);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.page {
  max-width: 52rem;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 20px 64px;
  display: grid;
  gap: 32px;
}
.stack { display: grid; gap: 32px; min-width: 0; }
h1, h2, h3 { color: var(--fg-strong); font-weight: 500; letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
h1 { font-size: var(--text-2xl); line-height: 1.15; }
h2 { font-size: var(--text-xl); line-height: 1.25; }
h3 { font-size: var(--text-lg); line-height: 1.3; }
p { margin: 0; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; box-shadow: 0 0 0 4px var(--ring); }
.eyebrow {
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 500;
  color: var(--fg-muted);
}
.mono { font-family: var(--font-mono); font-size: 0.8125rem; }
.muted { color: var(--fg-muted); }
.small { font-size: var(--text-sm); }
.prose { white-space: pre-wrap; overflow-wrap: anywhere; }

/* Header */
.top { display: grid; gap: 12px; }
.title-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.fresh { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; font-size: var(--text-sm); }
.fresh .why { color: var(--fg-muted); }
.syncline { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: var(--text-sm); color: var(--fg-muted); font-variant-numeric: tabular-nums; }
.summary { display: flex; flex-wrap: wrap; gap: 8px; }

/* Labelled status marks: a shape and a word, never colour alone. */
.mark {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 1px 8px;
  border-radius: 999px;
  border: 1px solid color-mix(in oklch, var(--tone, var(--neutral)) 40%, transparent);
  background: color-mix(in oklch, var(--tone, var(--neutral)) 10%, transparent);
  color: var(--fg-strong);
  font-size: var(--text-xs);
  font-weight: 500;
  line-height: 1.6;
  white-space: nowrap;
}
.mark::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--tone, var(--neutral));
  flex: none;
}
.mark.square::before { border-radius: 1px; }
.mark.ring::before { background: transparent; border: 1.5px solid var(--tone, var(--neutral)); }
.t-good { --tone: var(--success); }
.t-warn { --tone: var(--warning); }
.t-bad { --tone: var(--danger); }
.t-info { --tone: var(--accent); }
.t-imp { --tone: var(--important); }
.t-none { --tone: var(--neutral); }

/* Buttons and controls */
button {
  font: inherit;
  font-size: var(--text-sm);
  font-weight: 500;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--fg-strong);
  padding: 6px 12px;
  cursor: pointer;
  min-height: 34px;
}
button:hover:not(:disabled) { border-color: var(--fg-muted); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
button:disabled { cursor: not-allowed; opacity: 0.55; }
input[type="text"] {
  font: inherit;
  font-size: var(--text-sm);
  color: var(--fg-strong);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 6px 10px;
  width: 100%;
  min-width: 0;
}
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }

/* Sections */
section { display: grid; gap: 14px; min-width: 0; }
.section-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; }
.panel {
  background: var(--surface);
  border: 1px solid var(--border-muted);
  border-radius: 8px;
  min-width: 0;
}
.empty {
  border: 1px dashed var(--border);
  border-radius: 8px;
  padding: 20px;
  display: grid;
  gap: 8px;
}
.empty h3 { font-size: var(--text-base); }

/* Today */
.digest { padding: 14px 16px; display: grid; gap: 8px; }
.digest + .digest { border-top: 1px solid var(--border-muted); }
.digest pre {
  margin: 0;
  font-family: var(--font-sans);
  font-size: var(--text-sm);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  color: var(--fg);
  max-height: 28rem;
  overflow: auto;
}

/* Review requests and pull requests */
.group { display: grid; gap: 6px; }
.group > .eyebrow { padding-inline: 2px; }
.rows { list-style: none; margin: 0; padding: 0; }
.row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 6px 16px;
  padding: 12px 16px;
  border-top: 1px solid var(--border-muted);
}
.row:first-child { border-top: 0; }
.row.child { padding-left: 40px; position: relative; }
.row.child::after {
  content: "";
  position: absolute;
  left: 22px;
  top: 0;
  bottom: 50%;
  width: 10px;
  border-left: 1.5px solid var(--border);
  border-bottom: 1.5px solid var(--border);
  border-bottom-left-radius: 4px;
}
.row-main { display: grid; gap: 4px; min-width: 0; }
.row-key { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.row-title { color: var(--fg-strong); overflow-wrap: anywhere; }
.row-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: var(--text-sm); color: var(--fg-muted); font-variant-numeric: tabular-nums; }
.row-side { display: grid; gap: 6px; justify-items: end; align-content: start; }
.waiting.late { color: var(--warning); font-weight: 600; }
.confirm {
  grid-column: 1 / -1;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 12px;
  padding: 10px 12px;
  border-radius: var(--radius);
  background: color-mix(in oklch, var(--accent) 8%, transparent);
  border: 1px solid color-mix(in oklch, var(--accent) 30%, transparent);
  font-size: var(--text-sm);
}
.note { grid-column: 1 / -1; font-size: var(--text-sm); color: var(--fg-muted); }
.note.warn { color: var(--warning); }
.note.bad { color: var(--danger); }
label.check { display: inline-flex; align-items: center; gap: 6px; }

/* Plan index */
.index { list-style: none; margin: 0; padding: 0; }
.index li { border-top: 1px solid var(--border-muted); }
.index li:first-child { border-top: 0; }
.index a {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 4px 12px;
  padding: 12px 16px;
  color: inherit;
}
.index a:hover { text-decoration: none; background: color-mix(in oklch, var(--fg-strong) 4%, transparent); }
.index .name { color: var(--fg-strong); overflow-wrap: anywhere; }
.index .facts { display: flex; flex-wrap: wrap; gap: 6px; justify-content: end; align-items: center; }

/* A plan */
.plan { padding: 20px 16px; display: grid; gap: 18px; scroll-margin-top: 16px; }
.plan-head { display: grid; gap: 6px; }
.plan-facts { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: var(--text-sm); color: var(--fg-muted); }
.plan-part { display: grid; gap: 8px; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.steps li { display: grid; grid-template-columns: 4.5rem 6.5rem minmax(0, 1fr); gap: 10px; align-items: baseline; font-size: var(--text-sm); }
.steps .id { color: var(--fg-muted); }
.steps .title { overflow-wrap: anywhere; color: var(--fg); }
.steps li.done .title { color: var(--fg-muted); }
fieldset {
  margin: 0;
  border: 1px solid var(--border-muted);
  border-radius: 8px;
  padding: 14px 16px;
  display: grid;
  gap: 10px;
  min-width: 0;
}
legend { padding: 0 6px; margin-left: -6px; }
.q-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; }
.q-text { color: var(--fg-strong); font-weight: 500; overflow-wrap: anywhere; }
.options { display: grid; gap: 8px; }
.option { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; align-items: start; cursor: pointer; }
.option input { margin: 4px 0 0; accent-color: var(--accent); }
.option .label { color: var(--fg-strong); overflow-wrap: anywhere; }
.option .why { grid-column: 2; font-size: var(--text-sm); color: var(--fg-muted); overflow-wrap: anywhere; }
.other-field { grid-column: 2; }
.answered { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: var(--text-sm); }
.conflict {
  padding: 8px 12px;
  border-radius: var(--radius);
  border: 1px solid color-mix(in oklch, var(--warning) 45%, transparent);
  background: color-mix(in oklch, var(--warning) 10%, transparent);
  color: var(--fg-strong);
  font-size: var(--text-sm);
}
details > summary { cursor: pointer; color: var(--fg-strong); font-size: var(--text-sm); font-weight: 500; }
.decisions { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 10px; }
.decisions li { display: grid; gap: 2px; font-size: var(--text-sm); }
.decisions .answer { color: var(--fg-strong); overflow-wrap: anywhere; }

/* Diagrams: each closed until opened, when Mermaid draws it. */
.diagrams { display: grid; gap: 8px; }
details.diagram { border: 1px solid var(--border-muted); border-radius: 8px; padding: 10px 12px; min-width: 0; }
details.diagram > summary { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.diagram-body { display: grid; gap: 12px; margin-top: 12px; min-width: 0; }
.diagram-figure { overflow-x: auto; min-width: 0; }
.diagram-img { display: block; max-width: 100%; height: auto; }
/* The renderer frame lays out text, so it is rendered, out of sight. */
iframe.renderer {
  position: fixed;
  left: -10000px;
  top: 0;
  width: 1200px;
  height: 800px;
  border: 0;
  visibility: hidden;
  pointer-events: none;
}
.diagram-source {
  margin: 0;
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  white-space: pre;
  overflow-x: auto;
  color: var(--fg);
}
.elements { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: var(--text-sm); }
.elements li { display: grid; grid-template-columns: 2.75rem minmax(0, 1fr) auto; gap: 8px; align-items: baseline; }
.elements .label { color: var(--fg-strong); overflow-wrap: anywhere; }
.elements .where { color: var(--fg-muted); font-family: var(--font-mono); font-size: var(--text-xs); }

@media (max-width: 560px) {
  .row { grid-template-columns: minmax(0, 1fr); }
  .row-side { justify-items: start; }
  .row.child { padding-left: 32px; }
  .row.child::after { left: 14px; }
  .index a { grid-template-columns: minmax(0, 1fr); }
  .index .facts { justify-content: start; }
  .steps li { grid-template-columns: 3.5rem minmax(0, 1fr); }
  .steps li .kw { grid-column: 2; grid-row: 2; justify-self: start; }
  .elements li { grid-template-columns: 2.75rem minmax(0, 1fr); }
  .elements .where { grid-column: 2; }
}
@media (prefers-reduced-motion: reduce) {
  * { scroll-behavior: auto !important; transition: none !important; }
}
</style>

<!-- The one grammar of Mermaid the page renders, as internal/diagram
     writes it: by header, the kind it draws and the pattern of a node's
     line and an edge's, whose group 1 is the label; then the labels
     Mermaid 11.17.2 would draw as other than they read, or fail to parse:
     what its lexers read as another statement, what Markdown changes in a
     state diagram, and a transition's label ending in a colon. A source
     with a line outside it is shown as text. Export's page tests hold this
     and validSource to diagram.ValidSource. -->
<script type="application/json" id="grammar">
{
  "headers": {
    "flowchart LR": {"kind": "component",
      "node": "^    N[1-9][0-9]{0,2}\\[\"([A-Za-z0-9_.,:/()+=-](?:[A-Za-z0-9 _.,:/()+=-]{0,58}[A-Za-z0-9_.,:/()+=-])?)\"\\]$",
      "edge": "^    N[1-9][0-9]{0,2} -->\\|\"([A-Za-z0-9_.,:/()+=-](?:[A-Za-z0-9 _.,:/()+=-]{0,58}[A-Za-z0-9_.,:/()+=-])?)\"\\| N[1-9][0-9]{0,2}$"},
    "sequenceDiagram": {"kind": "sequence",
      "node": "^    participant N[1-9][0-9]{0,2} as ([A-Za-z0-9_.,:/()+=-](?:[A-Za-z0-9 _.,:/()+=-]{0,58}[A-Za-z0-9_.,:/()+=-])?)$",
      "edge": "^    N[1-9][0-9]{0,2}->>N[1-9][0-9]{0,2}: ([A-Za-z0-9_.,:/()+=-](?:[A-Za-z0-9 _.,:/()+=-]{0,58}[A-Za-z0-9_.,:/()+=-])?)$"},
    "stateDiagram-v2": {"kind": "state",
      "node": "^    state \"([A-Za-z0-9_.,:/()+=-](?:[A-Za-z0-9 _.,:/()+=-]{0,58}[A-Za-z0-9_.,:/()+=-])?)\" as N[1-9][0-9]{0,2}$",
      "edge": "^    N[1-9][0-9]{0,2} --> N[1-9][0-9]{0,2}: ([A-Za-z0-9_.,:/()+=-](?:[A-Za-z0-9 _.,:/()+=-]{0,58}[A-Za-z0-9_.,:/()+=-])?)$"}
  },
  "misread": [
    {"pattern": "direction\\s+(tb|td|bt|rl|lr)", "flags": "i", "kinds": ["component", "sequence", "state"], "on": ["node", "edge"]},
    {"pattern": "::", "flags": "", "kinds": ["state"], "on": ["node", "edge"]},
    {"pattern": "[,:]", "flags": "", "kinds": ["sequence"], "on": ["node"]},
    {"pattern": "^:?(no)?wrap:", "flags": "i", "kinds": ["sequence"], "on": ["edge"]},
    {"pattern": "(^|[^A-Za-z0-9_])_|_($|[^A-Za-z0-9_])", "flags": "", "kinds": ["state"], "on": ["node", "edge"]},
    {"pattern": "www\\.|https?://|ftp://", "flags": "i", "kinds": ["state"], "on": ["node", "edge"]},
    {"pattern": ":$", "flags": "", "kinds": ["state"], "on": ["edge"]}
  ]
}
</script>

<!-- The renderer: the script of the sandboxed frame that runs Mermaid,
     never run in this page. It answers only this page's window, draws one
     source at a time with its own settings, which no message changes but
     for colors and a face it checks, and sends back the SVG as a string. -->
<script type="text/plain" id="renderer">
"use strict";
(() => {
  const MAX_SOURCE = 20000;
  const HEX = /^#[0-9a-f]{6}$/;
  const FACE = /^[A-Za-z0-9 ,"'-]{1,200}$/;
  const say = (m) => parent.postMessage(m, "*");
  let queue = Promise.resolve();

  function config(t) {
    const c = (v) => (typeof v === "string" && HEX.test(v) ? v : "#808080");
    return {
      startOnLoad: false,
      securityLevel: "strict",
      maxTextSize: MAX_SOURCE,
      maxEdges: 100,
      htmlLabels: false,
      flowchart: { htmlLabels: false },
      theme: "base",
      themeVariables: {
        darkMode: t.dark === true, background: c(t.bg), fontSize: "14px",
        fontFamily: typeof t.font === "string" && FACE.test(t.font) ? t.font : "sans-serif",
        primaryColor: c(t.surface), primaryBorderColor: c(t.border), primaryTextColor: c(t.strong), secondaryColor: c(t.surface),
        tertiaryColor: c(t.bg), lineColor: c(t.muted), textColor: c(t.strong), edgeLabelBackground: c(t.bg),
        actorBkg: c(t.surface), actorBorder: c(t.border), actorTextColor: c(t.strong), actorLineColor: c(t.muted),
        signalColor: c(t.strong), signalTextColor: c(t.strong), labelBoxBkgColor: c(t.surface), labelTextColor: c(t.strong),
      },
    };
  }

  async function draw(m) {
    const target = document.getElementById("d");
    try {
      target.replaceChildren();
      target.removeAttribute("data-processed");
      target.textContent = m.source;
      mermaid.initialize(config(m.theme && typeof m.theme === "object" ? m.theme : {}));
      await mermaid.run({ nodes: [target] });
      const svg = target.querySelector("svg");
      const box = svg && svg.viewBox && svg.viewBox.baseVal;
      if (!box || !(box.width > 0) || !(box.height > 0)) throw new Error("Mermaid drew nothing");
      // As an image, the SVG is as large as its view box.
      svg.removeAttribute("style");
      svg.setAttribute("width", String(box.width));
      svg.setAttribute("height", String(box.height));
      say({ type: "drawn", id: m.id, svg: new XMLSerializer().serializeToString(svg), width: box.width, height: box.height });
    } catch (e) {
      say({ type: "failed", id: m.id, reason: String((e && e.message) || "Mermaid failed").slice(0, 200) });
    } finally {
      target.replaceChildren();
    }
  }

  window.addEventListener("message", (ev) => {
    const m = ev.data;
    if (ev.source !== parent || !m || typeof m !== "object" || m.type !== "draw" || !Number.isInteger(m.id)) return;
    if (typeof m.source !== "string" || m.source.length > MAX_SOURCE) {
      say({ type: "failed", id: m.id, reason: "the source is not text of at most " + MAX_SOURCE + " characters" });
      return;
    }
    queue = queue.then(() => draw(m));
  });
  say({ type: "ready", mermaid: typeof mermaid === "object" && mermaid !== null && typeof mermaid.run === "function" });
})();
</script>

<div class="page">
  <header class="top">
    <div class="title-row">
      <div>
        <p class="eyebrow" id="host-line">Devbox</p>
        <h1>Agent plans</h1>
      </div>
      <div class="actions">
        <button type="button" id="refresh" disabled>Refresh</button>
      </div>
    </div>
    <div class="fresh" id="fresh"><span class="mark ring t-none">Connecting</span><span class="why">Opening this page's database.</span></div>
    <div class="syncline" id="syncline"></div>
    <div class="summary" id="summary"></div>
    <p class="small muted" id="refresh-note" hidden></p>
  </header>
  <main id="app" class="stack">
    <section class="empty" aria-live="polite">
      <h3>Loading the plans</h3>
      <p class="small muted">This page shows every plan the devbox's agents keep, the reviews asked of you and the latest standup digest. They arrive from the page's own database in a moment.</p>
    </section>
  </main>
</div>

<script>
"use strict";
(() => {
  const SPEC = JSON.parse(document.getElementById("schema").textContent);
  const SCHEMA = 1;

  // The shapes of what the page builds IDs and links from, as the host
  // checks them.
  const PLAN_ID = /^[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9]+(?:-[a-z0-9]+)*\.[A-Za-z0-9][A-Za-z0-9_-]*$/;
  const QID = /^(?:P[0-9]+\.)?Q[0-9]+$/;
  const OPTION_KEY = /^[A-Z]$/;
  const SLUG = /^([A-Za-z0-9_][A-Za-z0-9_.-]{0,99})\/([A-Za-z0-9_][A-Za-z0-9_.-]{0,99})$/;
  const HEAD = /^[0-9a-f]{40}$/;
  const DAY = 86400000;
  const DIAGRAM_ID = /^G[1-9][0-9]{0,3}$/;
  const ELEMENT_ID = /^[NE][1-9][0-9]{0,2}$/;
  const SHORT_AT = /^[0-9a-f]{12}$/;
  const CODE_PATH = /^[A-Za-z0-9._/@+-]{1,200}$/;

  // Mermaid, fetched only once a diagram is opened, from this one file,
  // which the browser refuses unless its bytes have this hash. Changing
  // the version changes both, and the grammar block is held to that
  // version's lexers. It runs only in the renderer frame: a sandbox with
  // scripts and an opaque origin, so it reaches neither this page, its
  // database nor its comments. The frame's document is the renderer block
  // and Mermaid, nothing from a document.
  const MERMAID_SRC = "https://cdn.jsdelivr.net/npm/mermaid@11.17.2/dist/mermaid.min.js";
  const MERMAID_SRI = "sha384-EOXBFmc3gx5mb+vn0vPvvGqACToJD24hhacX5Yx+8NUUQrHIle/Qi5Bg9o3zKwW2";
  const FRAME_DOC = '<!doctype html><meta charset="utf-8"><body><div id="d"></div>' +
    '<scr' + 'ipt src="' + MERMAID_SRC + '" integrity="' + MERMAID_SRI + '" crossorigin="anonymous"></scr' + 'ipt>' +
    '<scr' + 'ipt>' + document.getElementById("renderer").textContent + '</scr' + 'ipt>';
  // The most a drawing may take, and the most bytes of SVG the page takes
  // back from the frame.
  const RENDER_TIMEOUT = 20000;
  const MAX_SVG = 2000000;

  const GRAMMAR_SPEC = JSON.parse(document.getElementById("grammar").textContent);
  const GRAMMAR = new Map(Object.entries(GRAMMAR_SPEC.headers).map(([header, g]) =>
    [header, { kind: g.kind, lines: [{ re: new RegExp(g.node), on: "node" }, { re: new RegExp(g.edge), on: "edge" }] }]));
  const MISREAD = GRAMMAR_SPEC.misread.map((m) => ({ re: new RegExp(m.pattern, m.flags), kinds: m.kinds, on: m.on }));

  const state = {
    db: null,
    comments: null,
    noDb: false,
    loaded: new Set(),
    errors: new Map(),
    plans: new Map(),
    github: null,
    meta: null,
    today: null,
    answers: new Map(),
    dispatch: new Map(),
    canWake: "off",
    confirm: null,
    notes: new Map(),
    forms: new Map(),
    // The diagrams opened, by plan ID~diagram ID, and what each shows.
    diagramsOpen: new Set(),
    drawn: new Map(),
  };

  // norm keeps of v only what spec names, each of its type or defaulted.
  function norm(v, spec) {
    if (Array.isArray(spec)) return Array.isArray(v) ? v.map((x) => norm(x, spec[0])) : [];
    if (spec === "string") return typeof v === "string" ? v : "";
    if (spec === "number") return typeof v === "number" && Number.isFinite(v) ? v : 0;
    if (spec === "boolean") return v === true;
    const out = {};
    const o = v && typeof v === "object" && !Array.isArray(v) ? v : {};
    for (const k of Object.keys(spec)) out[k] = norm(o[k], spec[k]);
    return out;
  }

  // h builds an element. Every string child becomes a text node, so no
  // document text is ever parsed as markup.
  function h(tag, props, ...kids) {
    const e = document.createElement(tag);
    if (props) {
      for (const [k, v] of Object.entries(props)) {
        if (v == null || v === false) continue;
        if (k === "class") e.className = v;
        else e.setAttribute(k, v === true ? "" : String(v));
      }
    }
    for (const k of kids.flat(Infinity)) {
      if (k == null || k === false) continue;
      e.append(typeof k === "string" || typeof k === "number" ? document.createTextNode(String(k)) : k);
    }
    return e;
  }

  function mark(text, tone, shape) {
    return h("span", { class: "mark " + tone + (shape ? " " + shape : "") }, text);
  }

  function when(iso) {
    const t = Date.parse(iso);
    return Number.isNaN(t) ? null : t;
  }

  function ago(iso) {
    const t = when(iso);
    if (t == null) return "never";
    const s = Math.max(0, Math.round((Date.now() - t) / 1000));
    if (s < 60) return "just now";
    if (s < 3600) return Math.round(s / 60) + " min ago";
    if (s < DAY / 1000) return Math.round(s / 3600) + " h ago";
    return Math.round(s / (DAY / 1000)) + " d ago";
  }

  function clock(iso) {
    const t = when(iso);
    if (t == null) return "";
    return new Date(t).toLocaleString(undefined, { weekday: "short", hour: "2-digit", minute: "2-digit" });
  }

  function timeEl(iso, text) {
    return when(iso) == null ? h("span", null, text) : h("time", { datetime: iso, title: clock(iso) }, text);
  }

  function prLink(repo, number) {
    const m = SLUG.exec(repo);
    const label = repo + "#" + number;
    if (!m || !Number.isInteger(number) || number < 1) return h("span", { class: "mono" }, label);
    return h("a", { class: "mono", href: "https://github.com/" + m[1] + "/" + m[2] + "/pull/" + number,
      target: "_blank", rel: "noopener noreferrer" }, label);
  }

  function dispatchID(repo, number) {
    const m = SLUG.exec(repo);
    return m && Number.isInteger(number) && number > 0 ? m[1] + "~" + m[2] + "~" + number : null;
  }

  function answerID(plan, q) {
    const id = plan.id + "~" + q.id;
    return PLAN_ID.test(plan.id) && QID.test(q.id) && id.length <= 200 ? id : null;
  }

  // ---- Writes: the answers and dispatch collections only. ----

  async function save(collection, id, body) {
    const db = state.db;
    if (!db) throw new Error("This view has no database.");
    let ref = null;
    if (collection === "answers") ref = db.collection("answers").doc(id);
    else if (collection === "dispatch") ref = db.collection("dispatch").doc(id);
    if (!ref) throw new Error("The page writes only answers and review requests.");
    await ref.set(body);
  }

  // wake asks the dashboard session for an update, as a comment sent to
  // Claude anchored on the control pressed.
  async function wake(control) {
    const c = state.comments;
    if (!c) return "off";
    let can = "off";
    try { can = await c.canSendToClaude(); } catch (e) { can = "off"; }
    state.canWake = can;
    if (can !== "available") return can;
    try {
      const anchor = await c.anchorFor(control);
      await c.sendToClaude({ anchor, text: "wake" });
      return "sent";
    } catch (e) {
      return e && e.code ? e.code : "upstream_error";
    }
  }

  function wakeNote(result) {
    switch (result) {
      case "sent": return "Sent. The devbox session picks it up in a moment.";
      case "no_session": return "Saved. The devbox session isn't connected, so it picks this up when it next runs.";
      case "consent_required": return "Saved, but the devbox session wasn't woken. Allow this page to comment for you, then press Refresh.";
      case "rate_limited": return "Saved, but the devbox session wasn't woken: too many wakes just now. Press Refresh in a minute.";
      default: return "Saved, but the devbox session wasn't woken. Press Refresh.";
    }
  }

  // own is table's own entry for key, or fallback: a key from a document,
  // such as "constructor", never reaches an inherited property.
  function own(table, key, fallback) {
    return Object.hasOwn(table, key) ? table[key] : fallback;
  }

  function writeError(e) {
    const code = e && e.code;
    if (code === "invalid_argument") return "Not saved: only this page's owner can answer from it.";
    if (code === "quota_exceeded") return "Not saved: the page's database is full.";
    if (code === "unavailable") return "Not saved: the database is briefly unavailable. Try again.";
    return "Not saved: " + (e && e.message ? e.message : "the database refused the write") + ".";
  }

  // ---- Freshness ----

  function freshness() {
    const m = state.meta;
    const g = state.github;
    const reasons = [];
    if (state.noDb) return { label: "No data", tone: "t-bad", shape: "square", why: "This view can't open the page's database. Only the page's owner can read it." };
    if (!state.loaded.has("meta")) return { label: "Connecting", tone: "t-none", shape: "ring", why: "Opening this page's database." };
    if (!m) return { label: "Waiting", tone: "t-none", shape: "ring", why: "The devbox session hasn't written to this page yet." };
    if (state.canWake === "no_session") reasons.push("the devbox session isn't connected, so nothing updates until it runs again");
    const paused = reasons.length > 0;
    if (!g || !g.at) reasons.push("GitHub hasn't been read yet");
    else if (g.stale) reasons.push("GitHub couldn't be read; its part is from " + ago(g.at));
    if (m.failed > 0) reasons.push(m.failed === 1 ? "one plan couldn't be read and shows as last exported" : m.failed + " plans couldn't be read and show as last exported");
    for (const [name] of state.errors) reasons.push("the " + name + " data stopped updating");
    const updated = "Updated " + ago(m.updated);
    if (paused) return { label: "Paused", tone: "t-warn", shape: "square", why: updated + "; " + reasons.join("; ") + "." };
    if (reasons.length) return { label: "Partial", tone: "t-warn", shape: "", why: updated + "; " + reasons.join("; ") + "." };
    return { label: "Live", tone: "t-good", shape: "", why: updated + "." };
  }

  function renderHeader() {
    const f = freshness();
    document.getElementById("fresh").replaceChildren(mark(f.label, f.tone, f.shape), h("span", { class: "why" }, f.why));
    const m = state.meta;
    const line = document.getElementById("syncline");
    const host = document.getElementById("host-line");
    host.textContent = m && m.host ? "From " + m.host : "Devbox";
    if (!m) { line.replaceChildren(); } else {
      const parts = [h("span", null, "Exported ", timeEl(m.updated, ago(m.updated)))];
      if (m.repo) {
        parts.push(h("span", null, "Plans last pushed ", timeEl(m.pushed, ago(m.pushed))));
        parts.push(h("span", null, "Other hosts fetched ", timeEl(m.fetched, ago(m.fetched))));
        const stalled = m.unsynced && when(m.pushed) != null && Date.now() - when(m.pushed) > 6 * 3600000;
        if (stalled) parts.push(mark("Sync stalled", "t-bad", "square"));
        else if (m.unsynced) parts.push(mark("Unsynced changes", "t-warn"));
      } else {
        parts.push(mark("No notes repository", "t-warn", "square"));
      }
      line.replaceChildren(...parts);
    }
    const summary = [];
    let open = 0;
    for (const p of state.plans.values()) if (m && p.host === m.host) open += p.questions.length;
    if (open) summary.push(h("a", { href: "#plans" }, mark(open === 1 ? "1 question for you" : open + " questions for you", "t-imp")));
    const reqs = state.github ? state.github.requests : [];
    const late = reqs.filter((r) => when(r.requested) != null && Date.now() - when(r.requested) >= 3 * DAY && !handled(r)).length;
    if (late) summary.push(h("a", { href: "#reviews" }, mark(late === 1 ? "1 review waiting 3+ days" : late + " reviews waiting 3+ days", "t-warn", "square")));
    document.getElementById("summary").replaceChildren(...summary);
    const refresh = document.getElementById("refresh");
    refresh.disabled = !state.comments;
    refresh.title = state.comments ? "Ask the devbox session for an update now" : "Waking the session needs the page's comments, which this view doesn't have";
  }

  // ---- Today ----

  function renderToday() {
    const t = state.today;
    if (!t || !t.digests.length) return null;
    const today = new Date();
    const iso = today.getFullYear() + "-" + String(today.getMonth() + 1).padStart(2, "0") + "-" + String(today.getDate()).padStart(2, "0");
    const heading = t.date === iso ? "Today" : "Latest digest";
    const date = new Date(t.date + "T12:00:00");
    const dateText = Number.isNaN(date.getTime()) ? t.date : date.toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" });
    return h("section", { id: "today", "aria-labelledby": "today-h" },
      h("div", { class: "section-head" }, h("h2", { id: "today-h" }, heading), h("span", { class: "small muted" }, dateText)),
      h("div", { class: "panel" }, t.digests.map((d) =>
        h("div", { class: "digest" },
          h("p", { class: "eyebrow" }, d.kind === "demo" ? "Demo" : "Standup"),
          h("pre", null, d.text)))));
  }

  // ---- Review requests ----

  const DISPATCH = {
    requested: ["Requested", "t-info", "ring"],
    queued: ["Queued", "t-info", ""],
    running: ["Reviewing", "t-imp", ""],
    postponed: ["Postponed", "t-warn", "square"],
    "needs-operator": ["Needs you", "t-bad", "square"],
    ready: ["Reviewed", "t-good", ""],
    failed: ["Failed", "t-bad", "square"],
    stale: ["Stale", "t-warn", "ring"],
    refused: ["Refused", "t-bad", "square"],
  };
  const FINAL = new Set(["needs-operator", "ready", "failed", "stale", "refused"]);

  function dispatchOf(r) {
    const id = dispatchID(r.repo, r.number);
    return id ? state.dispatch.get(id) || null : null;
  }

  // handled reports whether r's review is under way or on record, so its
  // wait no longer counts.
  function handled(r) {
    const d = dispatchOf(r);
    return !!(d && d.state && !FINAL.has(d.state)) || r.record === "yes";
  }

  function requestGroup(r) {
    const d = dispatchOf(r);
    if ((d && d.state && d.state !== "refused") || r.record === "yes") return "reviewed";
    if (r.ci === "failure" || r.ci === "error") return "blocked";
    if (r.draft) return "draft";
    return "ready";
  }

  function ciMark(ci) {
    switch (ci) {
      case "success": return mark("CI passing", "t-good");
      case "failure": case "error": return mark("CI failing", "t-bad", "square");
      case "pending": case "expected": return mark("CI running", "t-info", "ring");
      case "none": return mark("No CI", "t-none", "ring");
      default: return mark("CI unknown", "t-none", "ring");
    }
  }

  // stack orders rows oldest first, each stacked one right after the one
  // it builds on where both are in the list.
  function stack(rows, oldest) {
    const by = new Map(rows.map((r) => [r.repo + "#" + r.number, r]));
    const kids = new Map();
    const roots = [];
    for (const r of rows) {
      const parent = r.parent > 0 ? by.get(r.repo + "#" + r.parent) : null;
      if (parent && parent !== r) {
        const key = parent.repo + "#" + parent.number;
        if (!kids.has(key)) kids.set(key, []);
        kids.get(key).push(r);
      } else roots.push(r);
    }
    roots.sort(oldest);
    const out = [];
    const seen = new Set();
    const walk = (r, depth) => {
      const key = r.repo + "#" + r.number;
      if (seen.has(key)) return;
      seen.add(key);
      out.push({ r, depth });
      for (const k of (kids.get(key) || []).sort(oldest)) walk(k, depth + 1);
    };
    for (const r of roots) walk(r, 0);
    for (const r of rows) walk(r, 0);
    return out;
  }

  function requestRow(r, depth) {
    const id = dispatchID(r.repo, r.number);
    const d = dispatchOf(r);
    const waitedMs = when(r.requested) == null ? null : Date.now() - when(r.requested);
    const late = waitedMs != null && waitedMs >= 3 * DAY;
    const days = waitedMs == null ? null : Math.floor(waitedMs / DAY);
    const waiting = waitedMs == null ? "Waiting since unknown"
      : days >= 1 ? "Waiting " + days + (days === 1 ? " day" : " days") : "Waiting " + ago(r.requested).replace(" ago", "");
    const meta = [
      h("span", { class: "waiting" + (late ? " late" : "") }, late ? "▲ " + waiting : waiting),
      h("span", null, r.team ? "Team request" : "Asked of you"),
      ciMark(r.ci),
    ];
    if (r.draft) meta.push(mark("Draft", "t-none", "ring"));
    if (r.record === "yes") meta.push(mark("Review on record", "t-good"));
    if (r.parent > 0) meta.push(h("span", null, "Stacked on #" + r.parent));

    const side = [];
    const notes = [];
    const stale = d && (d.stale || (HEAD.test(d.head) && d.head !== r.head));
    if (d && d.state) {
      const [label, tone, shape] = own(DISPATCH, d.state, [d.state, "t-none", "ring"]);
      side.push(mark(label, tone, shape));
      if (stale) side.push(mark("Stale: new commits", "t-warn", "ring"));
      if (d.state === "postponed" && d.until) notes.push(h("p", { class: "note warn" }, "Postponed until ", timeEl(d.until, clock(d.until)), d.reason ? ": " + d.reason : "."));
      else if (d.reason) notes.push(h("p", { class: "note" + (FINAL.has(d.state) && d.state !== "ready" ? " bad" : "") }, d.reason));
      if (d.state === "requested") notes.push(h("p", { class: "note" }, "Waiting for the devbox to queue it."));
    }

    const canAsk = id && HEAD.test(r.head) && (!d || !d.state || FINAL.has(d.state) || d.state === "postponed");
    if (canAsk && state.db) {
      const anyway = !!(d && d.state === "postponed");
      const again = !!(d && d.state && FINAL.has(d.state) && d.state !== "refused");
      const button = h("button", { type: "button", id: "ask-" + id }, anyway ? "Run anyway" : again ? "Review again" : "Review");
      button.addEventListener("click", () => {
        state.confirm = { id, head: r.head, anyway, triage: d ? d.triage !== false : true, notice: "" };
        state.notes.delete(id);
        render();
        const yes = document.getElementById("confirm-" + id);
        if (yes) yes.focus();
      });
      if (!(state.confirm && state.confirm.id === id)) side.push(button);
    }

    const li = h("li", { class: "row" + (depth > 0 ? " child" : "") },
      h("div", { class: "row-main" },
        h("div", { class: "row-key" }, prLink(r.repo, r.number), h("span", { class: "row-title" }, r.title || "(no title)")),
        h("div", { class: "row-meta" }, meta)),
      h("div", { class: "row-side" }, side),
      notes);

    if (state.confirm && state.confirm.id === id) li.append(confirmBox(r, id));
    const note = state.notes.get(id);
    if (note) li.append(h("p", { class: "note" + (note.bad ? " bad" : "") }, note.text));
    return li;
  }

  function confirmBox(r, id) {
    const c = state.confirm;
    // The pull request moved while the confirm was open: say so, and
    // confirm the new head.
    if (c.head !== r.head) {
      c.head = r.head;
      c.notice = "New commits arrived since you opened this. Confirm to review the new head.";
    }
    const triage = h("input", { type: "checkbox", id: "triage-" + id });
    triage.checked = c.triage;
    triage.addEventListener("change", () => { c.triage = triage.checked; });
    const yes = h("button", { type: "button", class: "primary", id: "confirm-" + id }, c.anyway ? "Run past the quota" : "Start review");
    const no = h("button", { type: "button" }, "Cancel");
    no.addEventListener("click", () => { state.confirm = null; render(); });
    yes.addEventListener("click", async () => {
      const latest = (state.github ? state.github.requests : []).find((x) => dispatchID(x.repo, x.number) === id);
      if (!latest || latest.head !== c.head) {
        c.notice = latest ? "New commits arrived since you opened this. Confirm to review the new head." : "This review request is gone since you opened it.";
        if (latest) c.head = latest.head;
        render();
        return;
      }
      yes.disabled = no.disabled = true;
      const body = { schema: SCHEMA, state: "requested", triage: c.triage, anyway: c.anyway, at: new Date().toISOString() };
      try {
        await save("dispatch", id, body);
        state.confirm = null;
        state.notes.set(id, { text: "Saved. Waking the devbox session…" });
        render();
        state.notes.set(id, { text: wakeNote(await wake(document.getElementById("refresh"))) });
      } catch (e) {
        state.notes.set(id, { text: writeError(e), bad: true });
        yes.disabled = no.disabled = false;
      }
      render();
    });
    return h("div", { class: "confirm", role: "group", "aria-label": "Confirm the review" },
      c.notice ? h("p", { class: "conflict", style: "flex-basis:100%" }, c.notice) : null,
      h("span", null, (c.anyway ? "Run the review of " : "Review ") + r.repo + "#" + r.number + " at ", h("span", { class: "mono" }, r.head.slice(0, 7)), "?"),
      h("label", { class: "check", for: "triage-" + id }, triage, "Triage findings"),
      h("span", { class: "actions" }, yes, no));
  }

  function renderReviews() {
    const g = state.github;
    const head = h("div", { class: "section-head" }, h("h2", { id: "reviews-h" }, "Review requests"),
      g && g.at ? h("span", { class: "small muted" }, "GitHub read ", timeEl(g.at, ago(g.at))) : null);
    if (!g || !g.at) {
      return h("section", { id: "reviews", "aria-labelledby": "reviews-h" }, head,
        h("div", { class: "empty" }, h("h3", null, "No review requests yet"),

      h("summary", null, h("span", { class: "mono muted" }, d.id), h("span", null, d.title || "Diagram"),
        h("span", { class: "small muted" }, own(DIAGRAM_KIND, d.kind, "Diagram")), mark(label, tone, shape),
        SHORT_AT.test(d.at) ? h("span", { class: "mono small muted" }, "at " + d.at) : null),
      h("div", { class: "diagram-body" }, figure, elements));
    details.addEventListener("toggle", () => {
      if (details.open) {
        // Opened by the viewer, not drawn again with the page: a passing
        // failure is tried again.
        const had = state.drawn.get(key);
        if (!state.diagramsOpen.has(key) && had && had.retry) state.drawn.delete(key);
        state.diagramsOpen.add(key);
        drawDiagram(key, d, figure);
      } else state.diagramsOpen.delete(key);
    });
    if (details.open) drawDiagram(key, d, figure);
    return details;
  }

  // ---- Page ----

  let queued = false;
  function render() {
    if (queued) return;
    queued = true;
    requestAnimationFrame(() => { queued = false; draw(); });
  }

  function draw() {
    renderHeader();
    const app = document.getElementById("app");
    if (state.noDb) {
      app.replaceChildren(h("section", { class: "empty" }, h("h3", null, "This view can't read the plans"),
        h("p", { class: "small muted" }, "The plans and reviews live in this page's own database, which only the page's owner can open. Open the page signed in as its owner.")));
      return;
    }
    const ready = ["plans", "meta"].every((c) => state.loaded.has(c));
    if (!ready) return;
    const list = plansSorted();
    const parts = [renderToday(), renderReviews(), renderMine()];
    if (!list.length) {
      parts.push(h("section", { id: "plans", class: "empty" }, h("h3", null, "No plans yet"),
        h("p", { class: "small muted" }, state.meta
          ? "Every plan the agents keep, on any host, shows here unless it is halted. None is open right now."
          : "The devbox session fills this page from the plans it holds. Once it runs, each plan shows here with its steps and the questions it has for you. Press Refresh to ask it now.")));
    } else {
      parts.push(renderIndex(list));
      for (const p of list) parts.push(renderPlan(p));
    }
    // Forms of questions no longer shown are dropped.
    const shown = new Set();
    for (const p of list) for (const q of p.questions) shown.add(p.id + "~" + q.id);
    for (const k of [...state.forms.keys()]) if (!shown.has(k)) state.forms.delete(k);
    // So are drawings of diagrams no longer there.
    const kept = new Set();
    for (const p of list) for (const d of p.diagrams) kept.add(p.id + "~" + d.id);
    for (const k of [...state.drawn.keys()]) if (!kept.has(k)) state.drawn.delete(k);
    const focused = document.activeElement && document.activeElement.id;
    app.replaceChildren(...parts.filter(Boolean));
    if (focused) { const f = document.getElementById(focused); if (f) f.focus(); }
    if (!draw.scrolled && location.hash.length > 1) {
      draw.scrolled = true;
      // A malformed anchor is ignored.
      let target = null;
      try { target = document.getElementById(decodeURIComponent(location.hash.slice(1))); } catch (e) { target = null; }
      if (target) target.scrollIntoView();
    }
  }

  function subscribed(name) {
    return [() => { state.errors.delete(name); state.loaded.add(name); render(); },
      (e) => { state.errors.set(name, e && e.code ? e.code : "unavailable"); state.loaded.add(name); render(); }];
  }

  function watchCollection(query, name, into) {
    const [ok, fail] = subscribed(name);
    query.onSnapshot((snap) => {
      const m = new Map();
      for (const d of snap.docs) if (d.exists) m.set(d.id, norm(d.data(), own(SPEC, name, {})));
      state[into] = m;
      ok();
    }, fail);
  }

  function watchDoc(ref, name) {
    const [ok, fail] = subscribed(name);
    ref.onSnapshot((d) => { state[name] = d.exists ? norm(d.data(), own(SPEC, name, {})) : null; ok(); }, fail);
  }

  document.getElementById("refresh").addEventListener("click", async (ev) => {
    const button = ev.currentTarget;
    const note = document.getElementById("refresh-note");
    button.disabled = true;
    note.hidden = false;
    note.textContent = "Asking the devbox session for an update…";
    const result = await wake(button);
    note.textContent = result === "sent" ? "Asked. The page updates when the session has written."
      : result === "no_session" ? "The devbox session isn't connected, so nothing can update now."
      : result === "consent_required" ? "Allow this page to comment for you, then press Refresh again."
      : result === "writers_only" ? "Only the page's owner can wake the session."
      : "The session couldn't be reached from this view.";
    button.disabled = false;
    render();
  });

  async function start() {
    const claude = window.claude;
    if (!claude || typeof claude.use !== "function") { state.noDb = true; render(); return; }
    claude.use("comments").then(async (c) => {
      state.comments = c;
      if (c) { try { state.canWake = await c.canSendToClaude(); } catch (e) { state.canWake = "off"; } }
      render();
    });
    const db = await claude.use("db");
    if (!db) { state.noDb = true; render(); return; }
    state.db = db;
    watchCollection(db.collection("plans").limit(1000), "plans", "plans");
    watchDoc(db.doc("github/status"), "github");
    watchDoc(db.doc("meta/sync"), "meta");
    watchDoc(db.doc("today/digest"), "today");
    watchCollection(db.collection("answers").limit(1000), "answers", "answers");
    watchCollection(db.collection("dispatch").limit(1000), "dispatch", "dispatch");
    render();
  }

  // An open diagram is drawn again in the scheme the viewer switches to.
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => render());
  new MutationObserver(() => render()).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  // Relative times age while the page stays open.
  setInterval(() => { if (!document.hidden && !document.querySelector("form :focus, .confirm :focus")) render(); }, 60000);
  start();
})();
</script>
