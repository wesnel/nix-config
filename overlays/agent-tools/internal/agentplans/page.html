<style>

    --border-muted: oklch(26.9% 0 0);

    --fg: oklch(100% 0 0 / 0.74);
    --fg-muted: oklch(100% 0 0 / 0.55);
    --accent: oklch(74.6% 0.16 232.661);

<!-- The fields this page reads of each document, and their JSON types:
     the host's export and the session write them (internal/export and
     its page test hold this to their Go types). The page keeps only
     these, each defaulted where it is missing. -->
<script type="application/json" id="schema">
{
  "plans": {
    "schema": "number", "id": "string", "title": "string", "goal": "string", "status": "string",
    "host": "string", "updated": "string",
    "steps": [{"id": "string", "order": "number", "title": "string", "keyword": "string", "ready": "boolean"}],
    "decisions": [{"id": "string", "question": "string", "answer": "string"}],
    "questions": [{"id": "string", "text": "string", "priority": "string", "context": "string",

  },
  "github": {
    "schema": "number", "at": "string", "stale": "boolean", "mineTotal": "number", "requestsTotal": "number",
    "mine": [{"repo": "string", "number": "number", "title": "string", "draft": "boolean", "ci": "string",
      "review": "string", "unresolved": "number", "parent": "number"}],
    "requests": [{"repo": "string", "number": "number", "title": "string", "draft": "boolean", "team": "boolean",
      "requested": "string", "head": "string", "ci": "string", "record": "string", "parent": "number"}]
  },
  "meta": {

  },
  "today": {
    "schema": "number", "date": "string", "digests": [{"kind": "string", "text": "string"}]
  },
  "answers": {
    "schema": "number", "choice": "string", "text": "string", "state": "string", "at": "string", "reason": "string"
  },
  "dispatch": {
    "schema": "number", "state": "string", "triage": "boolean", "anyway": "boolean", "at": "string",
    "head": "string", "stale": "boolean", "until": "string", "reason": "string"
  }
}
</script>

<div class="page">
  <header class="top">
    <div class="title-row">
      <div>
        <p class="eyebrow" id="host-line">Devbox</p>
        <h1>Agent plans</h1>
      </div>
      <div class="actions">
        <button type="button" id="refresh" disabled>Refresh</button>
      </div>
    </div>
    <div class="fresh" id="fresh"><span class="mark ring t-none">Connecting</span><span class="why">Opening this page's database.</span></div>
    <div class="syncline" id="syncline"></div>
    <div class="summary" id="summary"></div>
    <p class="small muted" id="refresh-note" hidden></p>
  </header>
  <main id="app" class="stack">
    <section class="empty" aria-live="polite">
      <h3>Loading the plans</h3>
      <p class="small muted">This page shows every plan the devbox's agents keep, the reviews asked of you and the latest standup digest. They arrive from the page's own database in a moment.</p>
    </section>
  </main>
</div>

<script>
"use strict";
(() => {
  const SPEC = JSON.parse(document.getElementById("schema").textContent);
  const SCHEMA = 1;

  // The shapes of what the page builds IDs and links from, as the host
  // checks them.
  const PLAN_ID = /^[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9]+(?:-[a-z0-9]+)*\.[A-Za-z0-9][A-Za-z0-9_-]*$/;
  const QID = /^(?:P[0-9]+\.)?Q[0-9]+$/;
  const OPTION_KEY = /^[A-Z]$/;
  const SLUG = /^([A-Za-z0-9_][A-Za-z0-9_.-]{0,99})\/([A-Za-z0-9_][A-Za-z0-9_.-]{0,99})$/;
  const HEAD = /^[0-9a-f]{40}$/;
  const DAY = 86400000;

  const state = {
    db: null,
    comments: null,
    noDb: false,
    loaded: new Set(),
    errors: new Map(),
    plans: new Map(),
    github: null,
    meta: null,
    today: null,
    answers: new Map(),
    dispatch: new Map(),
    canWake: "off",
    confirm: null,
    notes: new Map(),
    forms: new Map(),
  };

  // norm keeps of v only what spec names, each of its type or defaulted.
  function norm(v, spec) {
    if (Array.isArray(spec)) return Array.isArray(v) ? v.map((x) => norm(x, spec[0])) : [];
    if (spec === "string") return typeof v === "string" ? v : "";
    if (spec === "number") return typeof v === "number" && Number.isFinite(v) ? v : 0;
    if (spec === "boolean") return v === true;
    const out = {};
    const o = v && typeof v === "object" && !Array.isArray(v) ? v : {};
    for (const k of Object.keys(spec)) out[k] = norm(o[k], spec[k]);
    return out;
  }

  // h builds an element. Every string child becomes a text node, so no
  // document text is ever parsed as markup.
  function h(tag, props, ...kids) {
    const e = document.createElement(tag);
    if (props) {
      for (const [k, v] of Object.entries(props)) {
        if (v == null || v === false) continue;
        if (k === "class") e.className = v;
        else e.setAttribute(k, v === true ? "" : String(v));
      }
    }
    for (const k of kids.flat(Infinity)) {
      if (k == null || k === false) continue;
      e.append(typeof k === "string" || typeof k === "number" ? document.createTextNode(String(k)) : k);
    }
    return e;
  }

  function mark(text, tone, shape) {
    return h("span", { class: "mark " + tone + (shape ? " " + shape : "") }, text);
  }

  function when(iso) {
    const t = Date.parse(iso);
    return Number.isNaN(t) ? null : t;
  }

  function ago(iso) {
    const t = when(iso);
    if (t == null) return "never";
    const s = Math.max(0, Math.round((Date.now() - t) / 1000));
    if (s < 60) return "just now";
    if (s < 3600) return Math.round(s / 60) + " min ago";
    if (s < DAY / 1000) return Math.round(s / 3600) + " h ago";
    return Math.round(s / (DAY / 1000)) + " d ago";
  }

  function clock(iso) {
    const t = when(iso);
    if (t == null) return "";
    return new Date(t).toLocaleString(undefined, { weekday: "short", hour: "2-digit", minute: "2-digit" });
  }

  function timeEl(iso, text) {
    return when(iso) == null ? h("span", null, text) : h("time", { datetime: iso, title: clock(iso) }, text);
  }

  function prLink(repo, number) {
    const m = SLUG.exec(repo);
    const label = repo + "#" + number;
    if (!m || !Number.isInteger(number) || number < 1) return h("span", { class: "mono" }, label);
    return h("a", { class: "mono", href: "https://github.com/" + m[1] + "/" + m[2] + "/pull/" + number,
      target: "_blank", rel: "noopener noreferrer" }, label);
  }

  function dispatchID(repo, number) {
    const m = SLUG.exec(repo);
    return m && Number.isInteger(number) && number > 0 ? m[1] + "~" + m[2] + "~" + number : null;
  }

  function answerID(plan, q) {
    const id = plan.id + "~" + q.id;
    return PLAN_ID.test(plan.id) && QID.test(q.id) && id.length <= 200 ? id : null;
  }

  // ---- Writes: the answers and dispatch collections only. ----

  async function save(collection, id, body) {
    const db = state.db;
    if (!db) throw new Error("This view has no database.");
    let ref = null;
    if (collection === "answers") ref = db.collection("answers").doc(id);
    else if (collection === "dispatch") ref = db.collection("dispatch").doc(id);
    if (!ref) throw new Error("The page writes only answers and review requests.");
    await ref.set(body);
  }

  // wake asks the dashboard session for an update, as a comment sent to
  // Claude anchored on the control pressed.
  async function wake(control) {
    const c = state.comments;
    if (!c) return "off";
    let can = "off";
    try { can = await c.canSendToClaude(); } catch (e) { can = "off"; }
    state.canWake = can;
    if (can !== "available") return can;
    try {
      const anchor = await c.anchorFor(control);
      await c.sendToClaude({ anchor, text: "wake" });
      return "sent";
    } catch (e) {
      return e && e.code ? e.code : "upstream_error";
    }
  }

  function wakeNote(result) {
    switch (result) {
      case "sent": return "Sent. The devbox session picks it up in a moment.";
      case "no_session": return "Saved. The devbox session isn't connected, so it picks this up when it next runs.";
      case "consent_required": return "Saved, but the devbox session wasn't woken. Allow this page to comment for you, then press Refresh.";
      case "rate_limited": return "Saved, but the devbox session wasn't woken: too many wakes just now. Press Refresh in a minute.";
      default: return "Saved, but the devbox session wasn't woken. Press Refresh.";
    }
  }

  // own is table's own entry for key, or fallback: a key from a document,
  // such as "constructor", never reaches an inherited property.
  function own(table, key, fallback) {
    return Object.hasOwn(table, key) ? table[key] : fallback;
  }

  function writeError(e) {
    const code = e && e.code;
    if (code === "invalid_argument") return "Not saved: only this page's owner can answer from it.";
    if (code === "quota_exceeded") return "Not saved: the page's database is full.";
    if (code === "unavailable") return "Not saved: the database is briefly unavailable. Try again.";
    return "Not saved: " + (e && e.message ? e.message : "the database refused the write") + ".";
  }

  // ---- Freshness ----

  function freshness() {
    const m = state.meta;
    const g = state.github;
    const reasons = [];
    if (state.noDb) return { label: "No data", tone: "t-bad", shape: "square", why: "This view can't open the page's database. Only the page's owner can read it." };
    if (!state.loaded.has("meta")) return { label: "Connecting", tone: "t-none", shape: "ring", why: "Opening this page's database." };
    if (!m) return { label: "Waiting", tone: "t-none", shape: "ring", why: "The devbox session hasn't written to this page yet." };
    if (state.canWake === "no_session") reasons.push("the devbox session isn't connected, so nothing updates until it runs again");
    const paused = reasons.length > 0;
    if (!g || !g.at) reasons.push("GitHub hasn't been read yet");
    else if (g.stale) reasons.push("GitHub couldn't be read; its part is from " + ago(g.at));
    if (m.failed > 0) reasons.push(m.failed === 1 ? "one plan couldn't be read and shows as last exported" : m.failed + " plans couldn't be read and show as last exported");
    for (const [name] of state.errors) reasons.push("the " + name + " data stopped updating");
    const updated = "Updated " + ago(m.updated);
    if (paused) return { label: "Paused", tone: "t-warn", shape: "square", why: updated + "; " + reasons.join("; ") + "." };
    if (reasons.length) return { label: "Partial", tone: "t-warn", shape: "", why: updated + "; " + reasons.join("; ") + "." };
    return { label: "Live", tone: "t-good", shape: "", why: updated + "." };
  }

  function renderHeader() {
    const f = freshness();
    document.getElementById("fresh").replaceChildren(mark(f.label, f.tone, f.shape), h("span", { class: "why" }, f.why));
    const m = state.meta;
    const line = document.getElementById("syncline");
    const host = document.getElementById("host-line");
    host.textContent = m && m.host ? "From " + m.host : "Devbox";
    if (!m) { line.replaceChildren(); } else {
      const parts = [h("span", null, "Exported ", timeEl(m.updated, ago(m.updated)))];
      if (m.repo) {
        parts.push(h("span", null, "Plans last pushed ", timeEl(m.pushed, ago(m.pushed))));
        parts.push(h("span", null, "Other hosts fetched ", timeEl(m.fetched, ago(m.fetched))));
        const stalled = m.unsynced && when(m.pushed) != null && Date.now() - when(m.pushed) > 6 * 3600000;
        if (stalled) parts.push(mark("Sync stalled", "t-bad", "square"));
        else if (m.unsynced) parts.push(mark("Unsynced changes", "t-warn"));
      } else {
        parts.push(mark("No notes repository", "t-warn", "square"));
      }
      line.replaceChildren(...parts);
    }
    const summary = [];
    let open = 0;
    for (const p of state.plans.values()) if (m && p.host === m.host) open += p.questions.length;
    if (open) summary.push(h("a", { href: "#plans" }, mark(open === 1 ? "1 question for you" : open + " questions for you", "t-imp")));
    const reqs = state.github ? state.github.requests : [];
    const late = reqs.filter((r) => when(r.requested) != null && Date.now() - when(r.requested) >= 3 * DAY && !handled(r)).length;
    if (late) summary.push(h("a", { href: "#reviews" }, mark(late === 1 ? "1 review waiting 3+ days" : late + " reviews waiting 3+ days", "t-warn", "square")));
    document.getElementById("summary").replaceChildren(...summary);
    const refresh = document.getElementById("refresh");
    refresh.disabled = !state.comments;
    refresh.title = state.comments ? "Ask the devbox session for an update now" : "Waking the session needs the page's comments, which this view doesn't have";
  }

  // ---- Today ----

  function renderToday() {
    const t = state.today;
    if (!t || !t.digests.length) return null;
    const today = new Date();
    const iso = today.getFullYear() + "-" + String(today.getMonth() + 1).padStart(2, "0") + "-" + String(today.getDate()).padStart(2, "0");
    const heading = t.date === iso ? "Today" : "Latest digest";
    const date = new Date(t.date + "T12:00:00");
    const dateText = Number.isNaN(date.getTime()) ? t.date : date.toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" });
    return h("section", { id: "today", "aria-labelledby": "today-h" },
      h("div", { class: "section-head" }, h("h2", { id: "today-h" }, heading), h("span", { class: "small muted" }, dateText)),
      h("div", { class: "panel" }, t.digests.map((d) =>
        h("div", { class: "digest" },
          h("p", { class: "eyebrow" }, d.kind === "demo" ? "Demo" : "Standup"),
          h("pre", null, d.text)))));
  }

  // ---- Review requests ----

  const DISPATCH = {
    requested: ["Requested", "t-info", "ring"],
    queued: ["Queued", "t-info", ""],
    running: ["Reviewing", "t-imp", ""],
    postponed: ["Postponed", "t-warn", "square"],
    "needs-operator": ["Needs you", "t-bad", "square"],
    ready: ["Reviewed", "t-good", ""],
    failed: ["Failed", "t-bad", "square"],
    stale: ["Stale", "t-warn", "ring"],
    refused: ["Refused", "t-bad", "square"],
  };
  const FINAL = new Set(["needs-operator", "ready", "failed", "stale", "refused"]);

  function dispatchOf(r) {
    const id = dispatchID(r.repo, r.number);
    return id ? state.dispatch.get(id) || null : null;
  }

  // handled reports whether r's review is under way or on record, so its
  // wait no longer counts.
  function handled(r) {
    const d = dispatchOf(r);
    return !!(d && d.state && !FINAL.has(d.state)) || r.record === "yes";
  }

  function requestGroup(r) {
    const d = dispatchOf(r);
    if ((d && d.state && d.state !== "refused") || r.record === "yes") return "reviewed";
    if (r.ci === "failure" || r.ci === "error") return "blocked";
    if (r.draft) return "draft";
    return "ready";
  }

  function ciMark(ci) {
    switch (ci) {
      case "success": return mark("CI passing", "t-good");
      case "failure": case "error": return mark("CI failing", "t-bad", "square");
      case "pending": case "expected": return mark("CI running", "t-info", "ring");
      case "none": return mark("No CI", "t-none", "ring");
      default: return mark("CI unknown", "t-none", "ring");
    }
  }

  // stack orders rows oldest first, each stacked one right after the one
  // it builds on where both are in the list.
  function stack(rows, oldest) {
    const by = new Map(rows.map((r) => [r.repo + "#" + r.number, r]));
    const kids = new Map();
    const roots = [];
    for (const r of rows) {
      const parent = r.parent > 0 ? by.get(r.repo + "#" + r.parent) : null;
      if (parent && parent !== r) {
        const key = parent.repo + "#" + parent.number;
        if (!kids.has(key)) kids.set(key, []);
        kids.get(key).push(r);
      } else roots.push(r);
    }
    roots.sort(oldest);
    const out = [];
    const seen = new Set();
    const walk = (r, depth) => {
      const key = r.repo + "#" + r.number;
      if (seen.has(key)) return;
      seen.add(key);
      out.push({ r, depth });
      for (const k of (kids.get(key) || []).sort(oldest)) walk(k, depth + 1);
    };
    for (const r of roots) walk(r, 0);
    for (const r of rows) walk(r, 0);
    return out;
  }

  function requestRow(r, depth) {
    const id = dispatchID(r.repo, r.number);
    const d = dispatchOf(r);
    const waitedMs = when(r.requested) == null ? null : Date.now() - when(r.requested);
    const late = waitedMs != null && waitedMs >= 3 * DAY;
    const days = waitedMs == null ? null : Math.floor(waitedMs / DAY);
    const waiting = waitedMs == null ? "Waiting since unknown"
      : days >= 1 ? "Waiting " + days + (days === 1 ? " day" : " days") : "Waiting " + ago(r.requested).replace(" ago", "");
    const meta = [
      h("span", { class: "waiting" + (late ? " late" : "") }, late ? "▲ " + waiting : waiting),
      h("span", null, r.team ? "Team request" : "Asked of you"),
      ciMark(r.ci),
    ];
    if (r.draft) meta.push(mark("Draft", "t-none", "ring"));
    if (r.record === "yes") meta.push(mark("Review on record", "t-good"));
    if (r.parent > 0) meta.push(h("span", null, "Stacked on #" + r.parent));

    const side = [];
    const notes = [];
    const stale = d && (d.stale || (HEAD.test(d.head) && d.head !== r.head));
    if (d && d.state) {
      const [label, tone, shape] = own(DISPATCH, d.state, [d.state, "t-none", "ring"]);
      side.push(mark(label, tone, shape));
      if (stale) side.push(mark("Stale: new commits", "t-warn", "ring"));
      if (d.state === "postponed" && d.until) notes.push(h("p", { class: "note warn" }, "Postponed until ", timeEl(d.until, clock(d.until)), d.reason ? ": " + d.reason : "."));
      else if (d.reason) notes.push(h("p", { class: "note" + (FINAL.has(d.state) && d.state !== "ready" ? " bad" : "") }, d.reason));
      if (d.state === "requested") notes.push(h("p", { class: "note" }, "Waiting for the devbox to queue it."));
    }

    const canAsk = id && HEAD.test(r.head) && (!d || !d.state || FINAL.has(d.state) || d.state === "postponed");
    if (canAsk && state.db) {
      const anyway = !!(d && d.state === "postponed");
      const again = !!(d && d.state && FINAL.has(d.state) && d.state !== "refused");
      const button = h("button", { type: "button", id: "ask-" + id }, anyway ? "Run anyway" : again ? "Review again" : "Review");
      button.addEventListener("click", () => {
        state.confirm = { id, head: r.head, anyway, triage: d ? d.triage !== false : true, notice: "" };
        state.notes.delete(id);
        render();
        const yes = document.getElementById("confirm-" + id);
        if (yes) yes.focus();
      });
      if (!(state.confirm && state.confirm.id === id)) side.push(button);
    }

    const li = h("li", { class: "row" + (depth > 0 ? " child" : "") },
      h("div", { class: "row-main" },
        h("div", { class: "row-key" }, prLink(r.repo, r.number), h("span", { class: "row-title" }, r.title || "(no title)")),
        h("div", { class: "row-meta" }, meta)),
      h("div", { class: "row-side" }, side),
      notes);

    if (state.confirm && state.confirm.id === id) li.append(confirmBox(r, id));
    const note = state.notes.get(id);
    if (note) li.append(h("p", { class: "note" + (note.bad ? " bad" : "") }, note.text));
    return li;
  }

  function confirmBox(r, id) {
    const c = state.confirm;
    // The pull request moved while the confirm was open: say so, and
    // confirm the new head.
    if (c.head !== r.head) {
      c.head = r.head;
      c.notice = "New commits arrived since you opened this. Confirm to review the new head.";
    }
    const triage = h("input", { type: "checkbox", id: "triage-" + id });
    triage.checked = c.triage;
    triage.addEventListener("change", () => { c.triage = triage.checked; });
    const yes = h("button", { type: "button", class: "primary", id: "confirm-" + id }, c.anyway ? "Run past the quota" : "Start review");
    const no = h("button", { type: "button" }, "Cancel");
    no.addEventListener("click", () => { state.confirm = null; render(); });
    yes.addEventListener("click", async () => {
      const latest = (state.github ? state.github.requests : []).find((x) => dispatchID(x.repo, x.number) === id);
      if (!latest || latest.head !== c.head) {
        c.notice = latest ? "New commits arrived since you opened this. Confirm to review the new head." : "This review request is gone since you opened it.";
        if (latest) c.head = latest.head;
        render();
        return;
      }
      yes.disabled = no.disabled = true;
      const body = { schema: SCHEMA, state: "requested", triage: c.triage, anyway: c.anyway, at: new Date().toISOString() };
      try {
        await save("dispatch", id, body);
        state.confirm = null;
        state.notes.set(id, { text: "Saved. Waking the devbox session…" });
        render();
        state.notes.set(id, { text: wakeNote(await wake(document.getElementById("refresh"))) });
      } catch (e) {
        state.notes.set(id, { text: writeError(e), bad: true });
        yes.disabled = no.disabled = false;

    });
    return h("div", { class: "confirm", role: "group", "aria-label": "Confirm the review" },
      c.notice ? h("p", { class: "conflict", style: "flex-basis:100%" }, c.notice) : null,
      h("span", null, (c.anyway ? "Run the review of " : "Review ") + r.repo + "#" + r.number + " at ", h("span", { class: "mono" }, r.head.slice(0, 7)), "?"),
      h("label", { class: "check", for: "triage-" + id }, triage, "Triage findings"),
      h("span", { class: "actions" }, yes, no));
  }

  function renderReviews() {
    const g = state.github;
    const head = h("div", { class: "section-head" }, h("h2", { id: "reviews-h" }, "Review requests"),
      g && g.at ? h("span", { class: "small muted" }, "GitHub read ", timeEl(g.at, ago(g.at))) : null);
    if (!g || !g.at) {
      return h("section", { id: "reviews", "aria-labelledby": "reviews-h" }, head,
        h("div", { class: "empty" }, h("h3", null, "No review requests yet"),
          h("p", { class: "small muted" }, "The devbox lists the pull requests whose review is asked of you once it has read GitHub. Press Refresh to ask it now.")));
    }
    const oldest = (a, b) => (when(a.requested) ?? Infinity) - (when(b.requested) ?? Infinity);
    const groups = [
      ["ready", "Ready to review"],
      ["blocked", "Blocked: CI failing"],
      ["draft", "Draft"],
      ["reviewed", "Queued or reviewed"],
    ];
    const parts = [];
    for (const [key, label] of groups) {
      const rows = g.requests.filter((r) => requestGroup(r) === key);
      if (!rows.length) continue;
      parts.push(h("div", { class: "group" },
        h("p", { class: "eyebrow" }, label + " · " + rows.length),
        h("ul", { class: "panel rows" }, stack(rows, oldest).map(({ r, depth }) => requestRow(r, depth)))));
    }
    if (!parts.length) {
      parts.push(h("div", { class: "empty" }, h("h3", null, "Nothing asked of you"),
        h("p", { class: "small muted" }, "No open pull request asks for your review, directly or through a team.")));
    }
    if (g.requestsTotal > g.requests.length) parts.push(h("p", { class: "small muted" }, "Showing " + g.requests.length + " of " + g.requestsTotal + "."));
    return h("section", { id: "reviews", "aria-labelledby": "reviews-h" }, head, parts);
  }

  function renderMine() {
    const g = state.github;
    if (!g || !g.at || !g.mine.length) return null;
    const newest = (a, b) => b.number - a.number;
    const rows = stack(g.mine, newest).map(({ r, depth }) => {
      const meta = [ciMark(r.ci)];
      if (r.draft) meta.push(mark("Draft", "t-none", "ring"));
      if (r.review === "approved") meta.push(mark("Approved", "t-good"));
      else if (r.review === "changes-requested") meta.push(mark("Changes requested", "t-bad", "square"));
      else if (r.review === "review-required") meta.push(mark("Review required", "t-info", "ring"));
      if (r.unresolved) meta.push(h("span", null, r.unresolved === 1 ? "1 open thread" : r.unresolved + " open threads"));
      if (r.parent > 0) meta.push(h("span", null, "Stacked on #" + r.parent));
      return h("li", { class: "row" + (depth > 0 ? " child" : "") },
        h("div", { class: "row-main" },
          h("div", { class: "row-key" }, prLink(r.repo, r.number), h("span", { class: "row-title" }, r.title || "(no title)")),
          h("div", { class: "row-meta" }, meta)));
    });
    return h("section", { id: "mine", "aria-labelledby": "mine-h" },
      h("div", { class: "section-head" }, h("h2", { id: "mine-h" }, "Your pull requests"),
        g.mineTotal > g.mine.length ? h("span", { class: "small muted" }, g.mine.length + " of " + g.mineTotal) : null),
      h("ul", { class: "panel rows" }, rows));
  }

  // ---- Plans ----

  const PLAN_STATUS = {
    planning: ["Planning", "t-info", "ring"],
    "reviewing-plan": ["Plan in review", "t-info", ""],
    working: ["Working", "t-imp", ""],
    reviewing: ["In review", "t-info", ""],
    "handed-back": ["Handed back", "t-good", "square"],
    unknown: ["Unknown", "t-none", "ring"],
  };
  const KEYWORD = {
    TODO: ["To do", "t-none", "ring"],
    STARTED: ["Started", "t-imp", ""],
    DONE: ["Done", "t-good", ""],
    VERIFIED: ["Verified", "t-good", "square"],
    ABANDONED: ["Dropped", "t-none", "square"],
    unknown: ["Unknown", "t-none", "ring"],
  };

  function statusMark(s) {
    const [label, tone, shape] = own(PLAN_STATUS, s, [s ? s.charAt(0).toUpperCase() + s.slice(1) : "Unknown", "t-none", "ring"]);
    return mark(label, tone, shape);
  }

  function plansSorted() {
    return [...state.plans.values()].filter((p) => PLAN_ID.test(p.id))
      .sort((a, b) => (when(b.updated) ?? 0) - (when(a.updated) ?? 0) || a.id.localeCompare(b.id));
  }

  function renderIndex(list) {
    const host = state.meta ? state.meta.host : "";
    return h("section", { id: "plans", "aria-labelledby": "plans-h" },
      h("div", { class: "section-head" }, h("h2", { id: "plans-h" }, "Plans"), h("span", { class: "small muted" }, list.length === 1 ? "1 plan" : list.length + " plans")),
      h("ul", { class: "panel index" }, list.map((p) => {
        const ready = p.steps.filter((s) => s.ready).length;
        const facts = [statusMark(p.status)];
        if (p.questions.length) facts.push(mark(p.questions.length === 1 ? "1 question" : p.questions.length + " questions", p.host === host ? "t-imp" : "t-none"));
        if (ready) facts.push(h("span", { class: "small muted" }, ready + " ready"));
        return h("li", null, h("a", { href: "#" + p.id },
          h("span", { class: "row-main" }, h("span", { class: "name" }, p.title || p.id),
            h("span", { class: "small muted" }, "On " + (p.host || "unknown") + " · updated ", timeEl(p.updated, ago(p.updated)))),
          h("span", { class: "facts" }, facts)));
      })));
  }

  function questionSig(q, a) {
    return JSON.stringify([q.text, q.options.map((o) => [o.key, o.label]), a ? [a.state, a.at, a.choice] : null]);
  }

  function answerStatus(a) {
    if (!a) return null;
    switch (a.state) {
      case "": return [mark("Sent", "t-info", "ring"), h("span", { class: "muted" }, "Waiting for the devbox to record it.")];
      case "recorded": return [mark("Recorded", "t-good"), h("span", { class: "muted" }, "The plan has your answer.")];
      case "settled": return [mark("Already settled", "t-none"), h("span", { class: "muted" }, "Someone answered it first.")];
      case "refused": return [mark("Refused", "t-bad", "square"), h("span", null, a.reason || "The devbox refused it.")];
      default: return [mark(a.state, "t-none", "ring")];
    }
  }

  function questionForm(plan, q, answerable) {
    const id = answerID(plan, q);
    const a = id ? state.answers.get(id) || null : null;
    const sig = questionSig(q, a);
    const key = plan.id + "~" + q.id;
    const kept = state.forms.get(key);
    if (kept && kept.dirty) {
      if (kept.base !== sig) {
        kept.notice.textContent = "This question or its answer changed since you started. Check it, then send again.";
        kept.notice.hidden = false;
      }
      kept.status.replaceChildren(...(answerStatus(a) || []));
      return kept.node;
    }

    const head = h("div", { class: "q-head" },
      h("span", { class: "mono muted" }, q.id),
      q.priority ? mark("Priority " + q.priority, q.priority === "A" ? "t-warn" : "t-none", "square") : null,
      h("span", { class: "q-text" }, q.text));
    const status = h("div", { class: "answered" }, answerStatus(a) || []);
    const notice = h("p", { class: "conflict", role: "status" });
    notice.hidden = true;
    const legend = h("legend", null, head);
    const parts = [legend];
    if (q.context) parts.push(h("p", { class: "small muted prose" }, q.context));

    if (!answerable || !id || !state.db) {
      parts.push(h("ul", { class: "options", style: "list-style:none;margin:0;padding:0" }, q.options.map((o) =>
        h("li", { class: "option" }, h("span", { class: "mono muted" }, o.key),
          h("span", { class: "label" }, o.label, o.recommended ? " " : null, o.recommended ? mark("Recommended", "t-info", "ring") : null),
          o.why ? h("span", { class: "why" }, o.why) : null))));
      parts.push(h("p", { class: "small muted" }, id && state.db ? "Answer on " + (plan.host || "its host") + ": only that host writes this plan." : "This question can't be answered from the page."));
      return h("fieldset", { class: "question" }, parts);
    }

    const name = "q-" + id;
    const record = { node: null, base: sig, dirty: false, notice, status };
    const touch = () => {
      if (!record.dirty) { record.dirty = true; record.base = questionSig(q, state.answers.get(id) || null); }
    };
    const radios = [];
    const options = h("div", { class: "options" });
    for (const o of q.options) {
      if (!OPTION_KEY.test(o.key)) continue;
      const input = h("input", { type: "radio", name, value: o.key, id: name + "-" + o.key });
      if (a && a.choice === o.key && a.state !== "refused") input.checked = true;
      input.addEventListener("change", touch);
      radios.push(input);
      options.append(h("label", { class: "option", for: name + "-" + o.key }, input,
        h("span", { class: "label" }, o.label, o.recommended ? " " : null, o.recommended ? mark("Recommended", "t-info", "ring") : null),
        o.why ? h("span", { class: "why" }, o.why) : null));
    }
    const other = h("input", { type: "radio", name, value: "other", id: name + "-other" });
    const otherText = h("input", { type: "text", id: name + "-text", maxlength: "1000", autocomplete: "off", "aria-label": "Your own answer", placeholder: "Your own answer, one line" });
    if (a && a.choice === "other" && a.state !== "refused") { other.checked = true; otherText.value = a.text; }
    other.addEventListener("change", () => { touch(); otherText.focus(); });
    // Typing an answer of your own chooses it, and a choice of an option
    // leaves the typed text unsent.
    otherText.addEventListener("input", () => { touch(); other.checked = true; });
    radios.push(other);
    options.append(h("label", { class: "option", for: name + "-other" }, other, h("span", { class: "label" }, "Other"),
      h("span", { class: "other-field" }, otherText)));

    const send = h("button", { type: "submit", class: "primary" }, a && a.state === "" ? "Send again" : "Send answer");
    const note = h("p", { class: "small muted", role: "status" });
    const form = h("form", { class: "question-form" },
      h("fieldset", { class: "question" }, parts, options, notice, h("div", { class: "actions" }, send, status), note));
    record.node = form;
    form.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const latestPlan = state.plans.get(plan.id);
      const latestQ = latestPlan ? latestPlan.questions.find((x) => x.id === q.id) : null;
      if (!latestQ) {
        notice.textContent = "This question is no longer open: it was settled since you loaded it.";
        notice.hidden = false;
        return;
      }
      const now = questionSig(latestQ, state.answers.get(id) || null);
      if (record.dirty && now !== record.base) {
        record.base = now;
        notice.textContent = "This question or its answer changed since you started. Check it, then send again.";
        notice.hidden = false;
        return;
      }
      const picked = radios.find((r) => r.checked);
      if (!picked) { note.textContent = "Pick an option, or write your own answer."; return; }
      let body;
      if (picked.value === "other") {
        const text = otherText.value.trim();
        // The host takes one line of at most 1000 characters, without
        // control or formatting characters.
        if (!text || [...text].length > 1000 || /[\p{Cc}\p{Cf}\p{Zl}\p{Zp}]/u.test(text)) {
          note.textContent = "Write your answer as one line of at most 1000 characters.";
          return;
        }
        body = { schema: SCHEMA, choice: "other", text, at: new Date().toISOString() };
      } else {
        body = { schema: SCHEMA, choice: picked.value, at: new Date().toISOString() };
      }
      send.disabled = true;
      notice.hidden = true;
      note.textContent = "Saving…";
      try {
        await save("answers", id, body);
        note.textContent = "Saved. Waking the devbox session…";
        state.forms.delete(key);
        state.notes.set(key, { text: wakeNote(await wake(send)) });
        render();
      } catch (e) {
        note.textContent = writeError(e);
        send.disabled = false;
      }
    });
    state.forms.set(key, record);
    const kept2 = state.notes.get(key);
    if (kept2) note.textContent = kept2.text;
    return form;
  }

  function renderPlan(p) {
    const host = state.meta ? state.meta.host : "";
    const answerable = !!host && p.host === host;
    const parts = [
      h("div", { class: "plan-head" },
        h("p", { class: "mono muted" }, p.id),
        h("h2", null, p.title || p.id),
        h("div", { class: "plan-facts" }, statusMark(p.status), h("span", null, "On " + (p.host || "unknown")),
          h("span", null, "Updated ", timeEl(p.updated, ago(p.updated))))),
    ];
    if (p.goal) parts.push(h("div", { class: "plan-part" }, h("p", { class: "eyebrow" }, "Goal"), h("p", { class: "prose" }, p.goal)));
    if (p.questions.length) {
      parts.push(h("div", { class: "plan-part" }, h("p", { class: "eyebrow" }, p.questions.length === 1 ? "Open question" : "Open questions · " + p.questions.length),
        p.questions.filter((q) => QID.test(q.id)).map((q) => questionForm(p, q, answerable))));
    }
    if (p.steps.length) {
      const steps = [...p.steps].sort((a, b) => a.order - b.order);
      const done = steps.filter((s) => s.keyword === "DONE" || s.keyword === "VERIFIED").length;
      parts.push(h("div", { class: "plan-part" }, h("p", { class: "eyebrow" }, "Steps · " + done + " of " + steps.length + " done"),
        h("ul", { class: "steps" }, steps.map((s) => {
          const [label, tone, shape] = own(KEYWORD, s.keyword, ["Unknown", "t-none", "ring"]);
          return h("li", { class: s.keyword === "DONE" || s.keyword === "VERIFIED" || s.keyword === "ABANDONED" ? "done" : "" },
            h("span", { class: "mono id" }, s.id), h("span", { class: "kw" }, mark(label, tone, shape)),
            h("span", { class: "title" }, s.title, s.ready && s.keyword === "TODO" ? " " : null, s.ready && s.keyword === "TODO" ? mark("Ready", "t-info") : null));
        }))));
    }
    if (p.decisions.length) {
      parts.push(h("details", null, h("summary", null, "Decisions · " + p.decisions.length),
        h("ul", { class: "decisions" }, [...p.decisions].reverse().map((d) =>
          h("li", null, h("span", { class: "muted" }, h("span", { class: "mono" }, d.id), " ", d.question), h("span", { class: "answer prose" }, d.answer))))));
    }
    return h("article", { class: "panel plan", id: p.id, "aria-label": p.title || p.id }, parts);
  }

  // ---- Page ----

  let queued = false;
  function render() {
    if (queued) return;
    queued = true;
    requestAnimationFrame(() => { queued = false; draw(); });
  }

  function draw() {
    renderHeader();
    const app = document.getElementById("app");
    if (state.noDb) {
      app.replaceChildren(h("section", { class: "empty" }, h("h3", null, "This view can't read the plans"),
        h("p", { class: "small muted" }, "The plans and reviews live in this page's own database, which only the page's owner can open. Open the page signed in as its owner.")));
      return;
    }
    const ready = ["plans", "meta"].every((c) => state.loaded.has(c));
    if (!ready) return;
    const list = plansSorted();
    const parts = [renderToday(), renderReviews(), renderMine()];
    if (!list.length) {
      parts.push(h("section", { id: "plans", class: "empty" }, h("h3", null, "No plans yet"),
        h("p", { class: "small muted" }, state.meta
          ? "Every plan the agents keep, on any host, shows here unless it is halted. None is open right now."
          : "The devbox session fills this page from the plans it holds. Once it runs, each plan shows here with its steps and the questions it has for you. Press Refresh to ask it now.")));
    } else {
      parts.push(renderIndex(list));
      for (const p of list) parts.push(renderPlan(p));
    }
    // Forms of questions no longer shown are dropped.
    const shown = new Set();
    for (const p of list) for (const q of p.questions) shown.add(p.id + "~" + q.id);
    for (const k of [...state.forms.keys()]) if (!shown.has(k)) state.forms.delete(k);
    const focused = document.activeElement && document.activeElement.id;
    app.replaceChildren(...parts.filter(Boolean));
    if (focused) { const f = document.getElementById(focused); if (f) f.focus(); }
    if (!draw.scrolled && location.hash.length > 1) {
      draw.scrolled = true;
      // A malformed anchor is ignored.
      let target = null;
      try { target = document.getElementById(decodeURIComponent(location.hash.slice(1))); } catch (e) { target = null; }
      if (target) target.scrollIntoView();
    }
  }

  function subscribed(name) {
    return [() => { state.errors.delete(name); state.loaded.add(name); render(); },
      (e) => { state.errors.set(name, e && e.code ? e.code : "unavailable"); state.loaded.add(name); render(); }];
  }

  function watchCollection(query, name, into) {
    const [ok, fail] = subscribed(name);
    query.onSnapshot((snap) => {
      const m = new Map();
      for (const d of snap.docs) if (d.exists) m.set(d.id, norm(d.data(), own(SPEC, name, {})));
      state[into] = m;
      ok();
    }, fail);
  }

  function watchDoc(ref, name) {
    const [ok, fail] = subscribed(name);
    ref.onSnapshot((d) => { state[name] = d.exists ? norm(d.data(), own(SPEC, name, {})) : null; ok(); }, fail);
  }

  document.getElementById("refresh").addEventListener("click", async (ev) => {
    const button = ev.currentTarget;
    const note = document.getElementById("refresh-note");
    button.disabled = true;
    note.hidden = false;
    note.textContent = "Asking the devbox session for an update…";
    const result = await wake(button);
    note.textContent = result === "sent" ? "Asked. The page updates when the session has written."
      : result === "no_session" ? "The devbox session isn't connected, so nothing can update now."
      : result === "consent_required" ? "Allow this page to comment for you, then press Refresh again."
      : result === "writers_only" ? "Only the page's owner can wake the session."
      : "The session couldn't be reached from this view.";
    button.disabled = false;
    render();
  });

  async function start() {
    const claude = window.claude;
    if (!claude || typeof claude.use !== "function") { state.noDb = true; render(); return; }
    claude.use("comments").then(async (c) => {
      state.comments = c;
      if (c) { try { state.canWake = await c.canSendToClaude(); } catch (e) { state.canWake = "off"; } }
      render();
    });
    const db = await claude.use("db");
    if (!db) { state.noDb = true; render(); return; }
    state.db = db;
    watchCollection(db.collection("plans").limit(1000), "plans", "plans");
    watchDoc(db.doc("github/status"), "github");
    watchDoc(db.doc("meta/sync"), "meta");
    watchDoc(db.doc("today/digest"), "today");
    watchCollection(db.collection("answers").limit(1000), "answers", "answers");
    watchCollection(db.collection("dispatch").limit(1000), "dispatch", "dispatch");
    render();
  }

  // Relative times age while the page stays open.
  setInterval(() => { if (!document.hidden && !document.querySelector("form :focus, .confirm :focus")) render(); }, 60000);
  start();
})();
</script>
